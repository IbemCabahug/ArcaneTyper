name: Supabase Keep-Alive

# WHY THIS FILE EXISTS (root repo, added 2026-09-23)
#
# A FREE Supabase project is paused after ~7 days with no API activity, and a
# paused project answers every request with an error — which the game used to
# swallow entirely (see backend/dbHealth.js). Before this file the only
# keep-alive lived in the PRIVATE DOCS repo (docs/.github/workflows/keepalive.yml),
# so the deployed repository had no heartbeat of its own, and that copy exits 0
# (green) when its secrets are missing — i.e. a silent pause risk.
#
# CADENCE (2026-09-23): twice a day instead of every 4 days. Supabase's own doc:
# "a few user requests to the database each day over the previous week is enough
# to keep the project from being paused" — so the heartbeat must be DAILY, and a
# run every 4 days was below that bar.
#
# THIS JOB IS NOT THE ONLY LAYER. GitHub auto-disables scheduled workflows in a
# public repo after 60 days of repository inactivity, so this cron can silently
# stop itself — the exact failure mode that let the project pause before. Layer
# 2 is an external cron, layer 3 is the in-app probe: the full three-layer setup
# and the recovery steps live in docs/arcaneTyper-docs/supabase-operations.md.
#
# ONE-TIME SETUP (repo owner): Settings -> Secrets and variables -> Actions:
#   SUPABASE_URL          = https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY     = the publishable anon key (already public in the client)
#   SUPABASE_ACCESS_TOKEN = OPTIONAL. A Personal Access Token (sbp_...) from the
#                           Supabase dashboard -> Account -> Access Tokens, with
#                           project_admin_write scope. It lets this job AUTO-RESUME
#                           a paused project instead of waiting for you to notice.
# Then: Actions tab -> "Supabase Keep-Alive" -> Run workflow, confirm HTTP 200.

on:
  schedule:
    - cron: '15 3 * * *'  # 03:15 UTC
    - cron: '15 15 * * *' # 15:15 UTC — twice daily beats the "each day" bar above
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "FAIL: repository secrets SUPABASE_URL / SUPABASE_ANON_KEY are not set."
            echo "Add them in Settings -> Secrets and variables -> Actions."
            echo "Until they exist the free-tier project can be paused after 7 idle days,"
            echo "which breaks login persistence, the Hall of Fame and Mage Duels."
            exit 1
          fi

          BASE=$(printf '%s' "$SUPABASE_URL" | tr -d ' \t\r\n' \
                 | sed -e 's/^["'\'']*//' -e 's/["'\'']*$//' -e 's#/*$##')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d ' \t\r\n' \
                 | sed -e 's/^["'\'']*//' -e 's/["'\'']*$//')

          case "$BASE" in
            */rest/v1) ;;
            *) BASE="${BASE}/rest/v1" ;;
          esac

          echo "Heartbeat target host: $(printf '%s' "$BASE" | sed -E 's#^(https?://[^/]+).*#\1#')"

          code=$(curl -s -o /tmp/heartbeat.json -w '%{http_code}' \
            "${BASE}/leaderboard?select=created_at&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "Supabase heartbeat HTTP $code"
          cat /tmp/heartbeat.json || true
          echo

          case "$code" in
            200)
              echo "Keep-alive OK — project is active."
              exit 0
              ;;
            000)
              echo "FAIL: network/DNS — SUPABASE_URL does not point at a reachable server."
              exit 1
              ;;
            400|401|403)
              echo "FAIL: the project answered $code."
              echo "400 usually means schema drift (run supabase/migrations/20260923_arcanetyper_schema_repair.sql)."
              echo "401/403 means check SUPABASE_ANON_KEY or that anon SELECT is allowed."
              exit 1
              ;;
            404)
              echo "HTTP 404 — the project looks PAUSED (or the table was renamed)."
              REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
              if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
                echo "AUTO-RESUME: POST https://api.supabase.com/v1/projects/${REF}/restore"
                rcode=$(curl -s -o /tmp/resume.json -w '%{http_code}' -X POST \
                  "https://api.supabase.com/v1/projects/${REF}/restore" \
                  -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
                echo "restore HTTP $rcode"
                cat /tmp/resume.json || true
                echo
                sleep 30  # restore takes a few seconds before REST answers again
                code=$(curl -s -o /tmp/heartbeat.json -w '%{http_code}' \
                  "${BASE}/leaderboard?select=created_at&limit=1" \
                  -H "apikey: ${KEY}" \
                  -H "Authorization: Bearer ${KEY}")
                if [ "$code" = "200" ]; then
                  echo "Keep-alive OK — project was paused and auto-resumed."
                  exit 0
                fi
                echo "FAIL: auto-resume did not bring the project back (restore ${rcode}, re-ping ${code})."
                echo "The token must be a PAT (sbp_...) with project_admin_write scope."
                echo "Resume manually: dashboard -> organization -> project -> Resume project."
                exit 1
              fi
              echo "FAIL: no SUPABASE_ACCESS_TOKEN secret, so this job cannot self-heal."
              echo "Resume manually in the dashboard, then add the token (see this file's header)."
              exit 1
              ;;
            *)
              echo "FAIL: unexpected HTTP $code."
              exit 1
              ;;
          esac
